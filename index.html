<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fauno Belo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. PANTALLA DE INICIO -->
    <section id="home">
        <h1>Fauno Belo</h1>
        <p>Por la vida, la naturaleza y nuestro futuro</p>
        <button onclick="showSection('categories')">Explorar</button>
        <button onclick="showSection('userProfileSection')">Perfil</button>
        <button onclick="showSection('reportSection')">Reportar Avistamiento</button>
    </section>

    <!-- 2. SECCIÓN DE EXPLORACIÓN / CATEGORÍAS -->
    <section id="categories" class="hidden">
        <div class="top-nav">
            <button onclick="showSection('home')">Volver</button>
            <button onclick="showSection('home')">Explorar fauna</button>
        </div>

        <div class="filters-bar">
            <input type="text" placeholder="Buscar especie...">
            <select>
                <option value="">Por categoría</option>
                <option value="anfibios">Anfibios</option>
                <option value="aves">Aves</option>
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <button>Todo</button>
            <button>Categorías</button>
            <button onclick="showSection('gameSection')">Jugar Trivia</button>
        </div>

        <!-- Contenedor de Tarjetas -->
        <div id="exploreCategories">
            <div class="animalCard">
                <div class="animalInfo">
                    <h4>Sapo común</h4>
                    <p class="animalScientificName">Rhinella horribilis</p>
                    <button class="animalCategory">Anfibios</button>
                </div>
            </div>
            <div class="animalCard">
                <div class="animalInfo">
                    <h4>Azulejo</h4>
                    <p class="animalScientificName">Thraupis episcopus</p>
                    <button class="animalCategory">Aves</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 3. SECCIÓN DE PERFIL -->
    <section id="userProfileSection" class="hidden">
        <button onclick="showSection('home')">Volver</button>
        <h2>Perfil de Usuario</h2>
        <p>Favoritos guardados: 0</p>
        <p>Reportes realizados: 0</p>
        <button onclick="showSection('home')">Cerrar Sesión</button>
    </section>

    <!-- 4. SECCIÓN DE REPORTES -->
    <section id="reportSection" class="hidden">
        <button onclick="showSection('home')">Volver</button>
        <h2>Reportar Avistamiento</h2>
        <form onsubmit="event.preventDefault(); alert('Reporte enviado');">
            <input type="text" placeholder="Especie vista">
            <input type="text" placeholder="Ubicación">
            <input type="date">
            <textarea placeholder="Notas adicionales"></textarea>
            <button type="submit">Enviar Reporte</button>
        </form>
    </section>

    <!-- 5. SECCIÓN DE MINIJUEGO -->
    <section id="gameSection" class="hidden">
        <button onclick="showSection('categories')">Volver</button>
        <h2>Minijuego Trivia</h2>
        <p>¿A qué categoría pertenece esta especie?</p>
        <div id="gameOptions">
            <button class="gameOptionBtn">Anfibio</button>
            <button class="gameOptionBtn">Ave</button>
        </div>
    </section>

    <!-- Enlace al archivo de JavaScript -->
    <script src="app.js"></script>
</body>
</html>
