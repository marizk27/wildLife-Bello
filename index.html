<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="home" id="home">
         <header class="homeHead">
            <section class="upperPan">
                <div class="profile">
                    <p>Perfíl</p>
                </div>
            </section>
            <section class="actionsPan">
                <div class="welcome">
                    <h1>Fauno Belo</h1>
                    <p>Por la pasión de descubrir</p>
                </div>
                <button id="explore" class="actionCard">
                    <h3>Explorar</h3>
                </button>
                <button id="report" class="actionCard">
                    <h3>Reportar avistamiento</h3>
                </button>
            </section>
        </header>
        <main>
            <article id="news" class="news"></article>
        </main>
    </section>
    <section id="categories" class="hidden sect">
        <section class="upperPan">
           <h1><-</h1>
            <h3>Volver</h3>
        </section>
        <header class="ExploreSearchPan">
            <h2>Explorar fauna</h2>
            <input id="filter" type="search" placeholder="Buscar especie">
            <select name="Categorías" id="filterCat">
                <option value="catego">Por categoría</option>
                <option value="name">Nombre cotidiano</option>
                <option value="sciNa">Nombre científico</option>
            </select>
        </header>
        <div class="exploreButtons">
            <button class="see">Todo</button>
            <button class="see">Categorías</button>
            <button class="see">¡Juega!</button>
        </div>
        <main id="exploreCategories" class="anList"></main>
    </section>
    <script type="module" src="app.js"></script>
</body>
</html>
