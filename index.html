<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fauno Belo</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================================
         PÁGINA PRINCIPAL (DISEÑO SELVÁTICO)
         ========================================= -->
    <section class="home" id="home">
        
        <!-- BARRA SUPERIOR CON PERFIL -->
        <header class="homeHeaderTop">
            <button type="button" class="profileBtn" id="profile">
                <span class="profileIcon">👤</span> Perfil
            </button>
        </header>

        <!-- CONTENIDO CENTRAL DEL HERO / BANNER -->
        <div class="heroContainer">
            
            <!-- LOGOTIPO Y TÍTULO -->
            <div class="brandBox">
                <div class="logoCircle">
                    <span class="deerIcon">🦌</span>
                </div>
                <h1>Fauno Belo</h1>
                <p>Por la vida, la naturaleza y nuestro futuro</p>
                <div class="dividerLine">🍃</div>
            </div>

            <!-- BOTONES DE ACCIÓN PRINCIPALES -->
            <div class="heroActions">
                <button type="button" id="explore" class="actionBtn">
                    <span class="btnIcon">🧭</span> Explorar
                </button>
                <button type="button" id="report" class="actionBtn">
                    <span class="btnIcon">🔭</span> Reportar avistamiento
                </button>
            </div>

        </div>

    </section>


    <!-- =========================================
         SECCIÓN EXPLORAR FAUNA (SECCIÓN SECUNDARIA)
         ========================================= -->
    <section id="categories" class="hidden sect">
        <section class="upperPan">
            <button type="button" id="back" class="dark-background">
                Volver
            </button>
            <h2 class="dark-background">Explorar fauna</h2>
        </section>

        <header class="ExploreSearchPan">
            <input id="filter" class="filter" type="search" placeholder="Buscar especie">
            <select class="cat" name="Categorías" id="filterCat">
                <option value="catego">Por categoría</option>
                <option value="name">Nombre cotidiano</option>
                <option value="sciNa">Nombre científico</option>
            </select>
        </header>

        <div class="exploreButtons">
            <button type="button" id="all" class="see">Todo</button>
            <button type="button" id="categoriesBtn" class="see">Categorías</button>
            <button type="button" id="play" class="see">¡Juega!</button>
        </div>

        <main id="exploreCategories" class="anList"></main>
    </section>


    <!-- =========================================
         MODAL / VENTANA DE MÁS INFORMACIÓN
         ========================================= -->
    <div id="speciesModal" class="modal hidden">
        <div class="modalContent">
            <button type="button" id="closeModal" class="closeModalBtn">×</button>
            <div id="modalBody"></div>
        </div>
    </div>


    <script type="module" src="./app.js"></script>
</body>

</html>
