<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fauno Belo</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================================
         PÁGINA PRINCIPAL
         ========================================= -->

    <section class="home" id="home">

        <header class="homeHead">

            <section class="upperPan">

                <div class="profile" id="profile">
                    <p>Perfíl</p>
                </div>

            </section>


            <section class="actionsPan">

                <div class="welcome">

                    <h1>Fauno Belo</h1>

                    <p>
                        Por la pasión de descubrir
                    </p>

                </div>


                <button
                    type="button"
                    id="explore"
                    class="actionCard"
                >
                    <h3>Explorar</h3>
                </button>


                <button
                    type="button"
                    id="report"
                    class="actionCard"
                >
                    <h3>Reportar avistamiento</h3>
                </button>

            </section>

        </header>


        <main>

            <article
                id="news"
                class="news"
            ></article>

        </main>

    </section>


    <!-- =========================================
         SECCIÓN EXPLORAR FAUNA
         ========================================= -->

    <section
        id="categories"
        class="hidden sect"
    >

        <!-- =====================================
             PARTE SUPERIOR
             ===================================== -->

        <section class="upperPan">

            <button
                type="button"
                id="back"
                class="dark-background"
            >
                Volver
            </button>


            <h2 class="dark-background">
                Explorar fauna
            </h2>

        </section>


        <!-- =====================================
             BUSCADOR
             ===================================== -->

        <header class="ExploreSearchPan">

            <input
                id="filter"
                class="filter"
                type="search"
                placeholder="Buscar especie"
            >


            <select
                class="cat"
                name="Categorías"
                id="filterCat"
            >

                <option value="catego">
                    Por categoría
                </option>

                <option value="name">
                    Nombre cotidiano
                </option>

                <option value="sciNa">
                    Nombre científico
                </option>

            </select>

        </header>


        <!-- =====================================
             BOTONES DE EXPLORACIÓN
             ===================================== -->

        <div class="exploreButtons">

            <button
                type="button"
                id="all"
                class="see"
            >
                Todo
            </button>


            <button
                type="button"
                id="categoriesBtn"
                class="see"
            >
                Categorías
            </button>


            <button
                type="button"
                id="play"
                class="see"
            >
                ¡Juega!
            </button>

        </div>


        <!-- =====================================
             LISTADO DE ANIMALES / CATEGORÍAS
             ===================================== -->

        <main
            id="exploreCategories"
            class="anList"
        ></main>

    </section>


    <!-- =========================================
         JAVASCRIPT PRINCIPAL
         ========================================= -->

    <script
        type="module"
        src="./app.js"
    ></script>

</body>

</html>
