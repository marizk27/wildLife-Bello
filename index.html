<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fauno Belo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de Inicio (Visible por defecto) -->
    <main id="home">
        <h1>Fauno Belo</h1>
        <button id="explore">Explorar</button>
        <button id="profile">Perfil</button>
        <button id="report">Reportar Avistamiento</button>
    </main>

    <!-- Sección de Categorías / Exploración (Oculta por defecto) -->
    <section id="categories" class="hidden">
        <button id="back">Volver al Inicio</button>
        <button id="all">Todos</button>
        <button id="categoriesBtn">Categorías</button>
        <button id="play">Jugar Trivia</button>
        <div id="filterCat">
            <input type="text" id="filter" placeholder="Buscar especie...">
        </div>
        <div id="exploreCategories"></div>
    </section>

    <!-- Sección de Autenticación / Login / Registro (Oculta por defecto) -->
    <section id="authSection" class="hidden">
        <button id="authBack">Volver</button>
        <div id="loginBox">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <input type="text" id="loginUser" placeholder="Usuario" required>
                <input type="password" id="loginPass" placeholder="Contraseña" required>
                <button type="submit">Entrar</button>
            </form>
            <p>¿No tienes cuenta? <a href="#" id="showRegister">Regístrate aquí</a></p>
        </div>
        <div id="registerBox" class="hidden">
            <h2>Registro</h2>
            <form id="registerForm">
                <input type="text" id="regUser" placeholder="Nuevo Usuario" required>
                <input type="password" id="regPass" placeholder="Nueva Contraseña" required>
                <button type="submit">Registrarse</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
        </div>
    </section>

    <!-- Sección de Perfil de Usuario (Oculta por defecto) -->
    <section id="userProfileSection" class="hidden">
        <button id="profileBack">Volver</button>
        <h2>Perfil de <span id="userNameDisplay"></span></h2>
        <p>Favoritos guardados: <span id="statFavorites">0</span></p>
        <p>Reportes realizados: <span id="statReports">0</span></p>
        <button id="logoutBtn">Cerrar Sesión</button>
    </section>

    <!-- Sección de Reportes (Oculta por defecto) -->
    <section id="reportSection" class="hidden">
        <button id="reportBack">Volver</button>
        <h2>Reportar Avistamiento</h2>
        <form id="reportForm">
            <input type="text" id="reportSpecies" placeholder="Especie vista" required>
            <input type="text" id="reportLocation" placeholder="Ubicación" required>
            <input type="date" id="reportDate" required>
            textarea id="reportNotes" placeholder="Notas adicionales"></textarea>
            <button type="submit">Enviar Reporte</button>
        </form>
    </section>

    <!-- Sección del Minijuego (Oculta por defecto) -->
    <section id="gameSection" class="hidden">
        <button id="gameBack">Salir del Juego</button>
        <h2>¿Qué animal es?</h2>
        <p>Puntuación: <span id="currentScore">0</span></p>
        <img id="gameImage" src="" alt="Adivina la especie" style="max-width: 300px; display: block; margin: 0 auto;">
        <div id="gameOptions"></div>
    </section>

    <!-- Modal de Información (Oculto por defecto) -->
    <div id="speciesModal" class="hidden">
        <div class="modalContent">
            <button id="closeModal">X</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Script principal -->
    <script src="app.js"></script>
</body>
</html>
