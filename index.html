```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fauno Belo</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- ==============================
         INICIO
         ============================== -->

    <section class="home" id="home">

        <header class="homeHead">

            <section class="upperPan">

                <div class="profile" id="profile">
                    <p>Perfil</p>
                </div>

            </section>


            <section class="actionsPan">

                <div class="welcome">

                    <h1>Fauno Belo</h1>

                    <p>
                        Por la pasión de descubrir
                    </p>

                </div>


                <button
                    type="button"
                    id="explore"
                    class="actionCard"
                >
                    <h3>Explorar</h3>
                </button>


                <button
                    type="button"
                    id="report"
                    class="actionCard"
                >
                    <h3>Reportar avistamiento</h3>
                </button>

            </section>

        </header>


        <main>

            <article
                id="news"
                class="news"
            ></article>

        </main>

    </section>


    <!-- ==============================
         EXPLORAR
         ============================== -->

    <section
        id="categories"
        class="hidden sect"
    >

        <section class="upperPan">

            <!-- IMPORTANTE:
                 ahora "Volver" sí es un botón -->

            <button
                type="button"
                id="back"
                class="dark-background"
            >
                Volver
            </button>


            <h2 class="dark-background">
                Explorar fauna
            </h2>

        </section>


        <!-- ==============================
             BUSCADOR
             ============================== -->

        <header class="ExploreSearchPan">

            <input
                id="filter"
                class="filter"
                type="search"
                placeholder="Buscar especie"
                autocomplete="off"
            >


            <select
                class="cat"
                name="Categorías"
                id="filterCat"
            >

                <option value="catego">
                    Por categoría
                </option>

                <option value="name">
                    Nombre cotidiano
                </option>

                <option value="sciNa">
                    Nombre científico
                </option>

            </select>

        </header>


        <!-- ==============================
             BOTONES DE EXPLORACIÓN
             ============================== -->

        <div class="exploreButtons">

            <button
                type="button"
                id="all"
                class="see"
            >
                Todo
            </button>


            <!-- NO usar id="categories"
                 porque la sección principal
                 ya tiene ese ID -->

            <button
                type="button"
                id="categoriesBtn"
                class="see"
            >
                Categorías
            </button>


            <button
                type="button"
                id="play"
                class="see"
            >
                ¡Juega!
            </button>

        </div>


        <!-- ==============================
             RESULTADOS
             ============================== -->

        <main
            id="exploreCategories"
            class="anList"
        ></main>

    </section>


    <!-- ==============================
         JAVASCRIPT
         ============================== -->

    <script
        type="module"
        src="./app.js"
    ></script>

</body>

</html>
```
