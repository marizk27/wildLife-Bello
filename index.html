```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fauno Belo</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================================
         INICIO
         ========================================= -->

    <section id="home" class="home">

        <header class="homeHead">

            <section class="upperPan">

                <div
                    id="profile"
                    class="profile"
                    role="button"
                    tabindex="0"
                >
                    <p>Perfil</p>
                </div>

            </section>


            <section class="actionsPan">

                <div class="welcome">

                    <h1>Fauno Belo</h1>

                    <p>
                        Por la pasión de descubrir
                    </p>

                </div>


                <!-- EXPLORAR -->

                <button
                    id="explore"
                    class="actionCard"
                    type="button"
                >

                    <h3>Explorar</h3>

                </button>


                <!-- REPORTAR -->

                <button
                    id="report"
                    class="actionCard"
                    type="button"
                >

                    <h3>
                        Reportar avistamiento
                    </h3>

                </button>

            </section>

        </header>


        <main>

            <article
                id="news"
                class="news"
            ></article>

        </main>

    </section>



    <!-- =========================================
         EXPLORAR
         ========================================= -->

    <section
        id="exploreSection"
        class="hidden sect"
    >

        <!-- PANEL SUPERIOR -->

        <section class="upperPan">

            <button
                id="back"
                class="dark-background"
                type="button"
            >
                Volver
            </button>


            <h2 class="dark-background">
                Explorar fauna
            </h2>

        </section>



        <!-- =========================================
             BUSCADOR
             ========================================= -->

        <header class="ExploreSearchPan">

            <input
                id="filter"
                class="filter"
                type="search"
                placeholder="Buscar especie"
                autocomplete="off"
            >


            <select
                id="filterCat"
                class="cat"
                name="Categorias"
            >

                <option value="catego">
                    Por categoría
                </option>

                <option value="name">
                    Nombre cotidiano
                </option>

                <option value="sciNa">
                    Nombre científico
                </option>

            </select>

        </header>



        <!-- =========================================
             BOTONES
             ========================================= -->

        <div class="exploreButtons">

            <button
                id="all"
                class="see"
                type="button"
            >
                Todo
            </button>


            <button
                id="categoriesBtn"
                class="see"
                type="button"
            >
                Categorías
            </button>


            <button
                id="play"
                class="see"
                type="button"
            >
                ¡Juega!
            </button>

        </div>



        <!-- =========================================
             RESULTADOS
             ========================================= -->

        <main
            id="exploreCategories"
            class="anList"
        ></main>

    </section>



    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script
        type="module"
        src="./app.js"
    ></script>

</body>

</html>
```
