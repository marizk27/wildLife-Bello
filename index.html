<!-- Sección de Favoritos dentro del Panel de Perfil -->
<div id="user-profile-section" class="bg-white rounded-xl shadow-md p-6 max-w-4xl mx-auto my-8">
    <h2 class="text-2xl font-bold text-green-800 mb-4">Mi Perfil - Fauno Belo</h2>
    
    <!-- Estadísticas -->
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-green-50 p-4 rounded-lg text-center">
            <span class="block text-3xl font-bold text-green-600" id="fav-counter">0</span>
            <span class="text-gray-600 text-sm">Especies Favoritas (♡)</span>
        </div>
        <div class="bg-green-50 p-4 rounded-lg text-center">
            <span class="block text-3xl font-bold text-green-600" id="sightings-counter">0</span>
            <span class="text-gray-600 text-sm">Avistamientos Reportados</span>
        </div>
    </div>

    <!-- Contenedor de la Lista de Favoritos Interactiva -->
    <div class="mt-6">
        <h3 class="text-xl font-semibold text-gray-700 mb-3">Tus Especies Guardadas</h3>
        <div id="favorites-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Las tarjetas de favoritos se inyectarán dinámicamente aquí -->
            <p class="text-gray-500 italic col-span-full" id="no-favorites-msg">Aún no tienes especies guardadas como favoritas.</p>
        </div>
    </div>
</div>
